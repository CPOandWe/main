basePath: /
definitions:
  models.Book:
    properties:
      book_id:
        type: string
      description:
        type: string
      is_public:
        type: boolean
      title:
        type: string
    type: object
  models.BookIDResponse:
    properties:
      book_id:
        type: string
    type: object
  models.ChangeRoleBody:
    properties:
      role_id:
        type: integer
    required:
    - role_id
    type: object
  models.CreateBookBody:
    properties:
      author_id:
        type: string
      description:
        type: string
      language_id:
        type: string
      published_at:
        type: string
      title:
        type: string
    required:
    - author_id
    - description
    - language_id
    - published_at
    - title
    type: object
  models.ErrorResponse:
    properties:
      errors:
        additionalProperties:
          type: string
        type: object
      message:
        type: string
    type: object
  models.LoginBody:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  models.MeResponse:
    properties:
      email:
        type: string
      role:
        type: string
      user_id:
        type: string
      username:
        type: string
    type: object
  models.SignUpBody:
    properties:
      email:
        type: string
      password:
        minLength: 8
        type: string
      username:
        type: string
    required:
    - email
    - password
    - username
    type: object
  models.SignUpResponse:
    properties:
      user_id:
        type: string
    type: object
  models.UpdateBookBody:
    properties:
      author_id:
        type: string
      description:
        minLength: 1
        type: string
      language_id:
        type: string
      published_at:
        type: string
      title:
        minLength: 1
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  title: Readness API
  version: "1.0"
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      description: Вход пользователя по почте и паролю
      parameters:
      - description: Данные для входа
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.LoginBody'
      produces:
      - application/json
      responses:
        "204":
          description: Токены установлены в cookie
        "400":
          description: Invalid request or validation error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "401":
          description: Invalid credentials
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Вход
      tags:
      - Auth
  /auth/logout:
    post:
      description: Удаляет refresh-токен из БД и очищает cookie
      responses:
        "204":
          description: Cookie очищены
      summary: Выход
      tags:
      - Auth
  /auth/refresh:
    post:
      description: Выдаёт новый access-токен (в cookie) по refresh-токену из cookie
      produces:
      - application/json
      responses:
        "204":
          description: Новый access-токен установлен в cookie
        "401":
          description: Invalid or expired refresh token
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Обновление токена
      tags:
      - Auth
  /auth/signup:
    post:
      consumes:
      - application/json
      description: Регистрация пользователя по имени, почте и паролю. Сразу выдаёт
        токены в HttpOnly cookie, как login
      parameters:
      - description: Данные для регистрации
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.SignUpBody'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.SignUpResponse'
        "400":
          description: Invalid request or validation error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Регистрация
      tags:
      - Auth
  /books:
    get:
      description: Публичные книги с фильтрами и поиском по названию, по 20 на страницу
      parameters:
      - description: Поиск по названию
        in: query
        name: q
        type: string
      - description: ID жанра
        in: query
        name: topic_id
        type: string
      - description: ID языка
        in: query
        name: language_id
        type: string
      - description: ID автора
        in: query
        name: author_id
        type: string
      - description: Страница, с 1
        in: query
        name: page
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.Book'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Список книг
      tags:
      - Books
    post:
      consumes:
      - application/json
      description: Создаёт непубличную книгу; публикация — через заявку на модерацию
      parameters:
      - description: Данные книги
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.CreateBookBody'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.BookIDResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Создание книги
      tags:
      - Books
  /books/{id}:
    delete:
      description: Владелец или модератор
      parameters:
      - description: ID книги
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: Удалено
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Удаление книги
      tags:
      - Books
    get:
      description: Публичная книга видна всем, непубличная — только владельцу и модераторам
      parameters:
      - description: ID книги
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Book'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Книга
      tags:
      - Books
    patch:
      consumes:
      - application/json
      description: Владелец может править пока книга не опубликована, модератор —
        всегда. Меняются только переданные поля
      parameters:
      - description: ID книги
        in: path
        name: id
        required: true
        type: string
      - description: Изменяемые поля
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.UpdateBookBody'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.BookIDResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Редактирование книги
      tags:
      - Books
  /users/{id}/role:
    patch:
      consumes:
      - application/json
      description: Меняет роль пользователя (только Admin). Снятие модератора — выдача
        роли user
      parameters:
      - description: ID пользователя
        in: path
        name: id
        required: true
        type: string
      - description: Новая роль
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.ChangeRoleBody'
      responses:
        "204":
          description: Роль изменена
        "400":
          description: Invalid request, unknown role or own role
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "404":
          description: User not found
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Смена роли
      tags:
      - Users
  /users/me:
    get:
      description: Данные авторизованного пользователя (по access-токену из cookie)
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.MeResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Текущий пользователь
      tags:
      - Users
  /users/me/books:
    get:
      description: Книги из библиотеки пользователя, опционально по статусу
      parameters:
      - description: Статус
        in: query
        name: status
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.Book'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Моя библиотека
      tags:
      - Books
swagger: "2.0"

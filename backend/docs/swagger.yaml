basePath: /
definitions:
  models.Author:
    properties:
      author_id:
        type: string
      first_name:
        type: string
      last_name:
        type: string
    type: object
  models.Book:
    properties:
      book_id:
        type: string
      cover_url:
        description: null when the book has no cover
        type: string
      description:
        type: string
      is_public:
        type: boolean
      title:
        type: string
    type: object
  models.BookIDResponse:
    properties:
      book_id:
        type: string
    type: object
  models.BookStatusResponse:
    properties:
      reason:
        description: set when rejected
        type: string
      status:
        description: draft, pending, approved, rejected, published
        type: string
    type: object
  models.ChangeRoleBody:
    properties:
      role_id:
        type: integer
    required:
    - role_id
    type: object
  models.CreateBookBody:
    properties:
      author_id:
        type: string
      description:
        type: string
      language_id:
        type: string
      published_at:
        type: string
      title:
        type: string
    required:
    - author_id
    - description
    - language_id
    - published_at
    - title
    type: object
  models.ErrorResponse:
    properties:
      errors:
        additionalProperties:
          type: string
        type: object
      message:
        type: string
    type: object
  models.Language:
    properties:
      language_id:
        type: string
      name:
        type: string
    type: object
  models.LibraryBook:
    properties:
      book_id:
        type: string
      cover_url:
        type: string
      description:
        type: string
      is_public:
        type: boolean
      status:
        type: string
      title:
        type: string
    type: object
  models.LoginBody:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  models.MeResponse:
    properties:
      email:
        type: string
      role:
        type: string
      user_id:
        type: string
      username:
        type: string
    type: object
  models.ModerationRequest:
    properties:
      author:
        type: string
      book_id:
        type: string
      description:
        type: string
      is_public:
        type: boolean
      request_id:
        type: string
      title:
        type: string
    type: object
  models.ReadingStatusBody:
    properties:
      status:
        enum:
        - reading
        - read
        type: string
    required:
    - status
    type: object
  models.ReviewRequestBody:
    properties:
      reason:
        type: string
      status:
        enum:
        - approved
        - rejected
        type: string
    required:
    - status
    type: object
  models.ReviewRequestResponse:
    properties:
      reason:
        type: string
      status:
        type: string
    type: object
  models.SignUpBody:
    properties:
      email:
        type: string
      password:
        minLength: 8
        type: string
      username:
        type: string
    required:
    - email
    - password
    - username
    type: object
  models.SignUpResponse:
    properties:
      user_id:
        type: string
    type: object
  models.Topic:
    properties:
      name:
        type: string
      topic_id:
        type: string
    type: object
  models.UpdateBookBody:
    properties:
      author_id:
        type: string
      description:
        minLength: 1
        type: string
      language_id:
        type: string
      published_at:
        type: string
      title:
        minLength: 1
        type: string
    type: object
  models.UploadedBook:
    properties:
      book_id:
        type: string
      cover_url:
        type: string
      description:
        type: string
      is_public:
        type: boolean
      status:
        type: string
      title:
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  title: Readness API
  version: "1.0"
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      description: Вход пользователя по почте и паролю
      parameters:
      - description: Данные для входа
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.LoginBody'
      produces:
      - application/json
      responses:
        "204":
          description: Токены установлены в cookie
        "400":
          description: Invalid request or validation error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "401":
          description: Invalid credentials
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Вход
      tags:
      - Auth
  /auth/logout:
    post:
      description: Удаляет refresh-токен из БД и очищает cookie
      responses:
        "204":
          description: Cookie очищены
      summary: Выход
      tags:
      - Auth
  /auth/refresh:
    post:
      description: Выдаёт новый access-токен (в cookie) по refresh-токену из cookie
      produces:
      - application/json
      responses:
        "204":
          description: Новый access-токен установлен в cookie
        "401":
          description: Invalid or expired refresh token
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Обновление токена
      tags:
      - Auth
  /auth/signup:
    post:
      consumes:
      - application/json
      description: Регистрация пользователя по имени, почте и паролю
      parameters:
      - description: Данные для регистрации
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.SignUpBody'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.SignUpResponse'
        "400":
          description: Invalid request or validation error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Регистрация
      tags:
      - Auth
  /authors:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.Author'
            type: array
      summary: Список авторов
      tags:
      - Dictionaries
  /books:
    get:
      description: Публичные книги с фильтрами и поиском по названию, по 20 на страницу
      parameters:
      - description: Поиск по названию
        in: query
        name: q
        type: string
      - description: ID жанра
        in: query
        name: topic_id
        type: string
      - description: ID языка
        in: query
        name: language_id
        type: string
      - description: ID автора
        in: query
        name: author_id
        type: string
      - description: Страница, с 1
        in: query
        name: page
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.Book'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Список книг
      tags:
      - Books
    post:
      consumes:
      - application/json
      description: Создаёт непубличную книгу; публикация — через заявку на модерацию
      parameters:
      - description: Данные книги
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.CreateBookBody'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.BookIDResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Создание книги
      tags:
      - Books
  /books/{id}:
    delete:
      description: Владелец или модератор
      parameters:
      - description: ID книги
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: Удалено
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Удаление книги
      tags:
      - Books
    get:
      description: Публичная книга видна всем, непубличная — только владельцу и модераторам
      parameters:
      - description: ID книги
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Book'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Книга
      tags:
      - Books
    patch:
      consumes:
      - application/json
      description: Владелец может править пока книга не опубликована, модератор —
        всегда. Меняются только переданные поля
      parameters:
      - description: ID книги
        in: path
        name: id
        required: true
        type: string
      - description: Изменяемые поля
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.UpdateBookBody'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.BookIDResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Редактирование книги
      tags:
      - Books
  /books/{id}/cover:
    get:
      description: Видимость как у самой книги
      parameters:
      - description: ID книги
        in: path
        name: id
        required: true
        type: string
      produces:
      - image/jpeg
      - image/png
      - image/webp
      responses:
        "200":
          description: OK
          schema:
            type: file
        "404":
          description: Book or cover not found
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Обложка книги
      tags:
      - Books
    put:
      consumes:
      - multipart/form-data
      description: 'multipart/form-data, поле cover: JPEG, PNG или WebP до 2 МБ. Права
        как у редактирования книги. Заменяет прежнюю обложку'
      parameters:
      - description: ID книги
        in: path
        name: id
        required: true
        type: string
      - description: Файл обложки
        in: formData
        name: cover
        required: true
        type: file
      responses:
        "204":
          description: Обложка сохранена
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "413":
          description: Request Entity Too Large
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Загрузка обложки
      tags:
      - Books
  /books/{id}/download:
    get:
      description: Только для авторизованных. Видимость как у самой книги
      parameters:
      - description: ID книги
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/pdf
      responses:
        "200":
          description: OK
          schema:
            type: file
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "404":
          description: Book or file not found
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Скачивание PDF
      tags:
      - Books
  /books/{id}/file:
    put:
      consumes:
      - multipart/form-data
      description: 'multipart/form-data, поле file: PDF до 50 МБ. Права как у редактирования
        книги. Заменяет прежний файл'
      parameters:
      - description: ID книги
        in: path
        name: id
        required: true
        type: string
      - description: PDF-файл
        in: formData
        name: file
        required: true
        type: file
      responses:
        "204":
          description: Файл сохранён
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "413":
          description: Request Entity Too Large
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Загрузка PDF книги
      tags:
      - Books
  /books/{id}/publish:
    post:
      description: Модератор публикует книгу без заявки (закрывает открытую заявку
        как approved)
      parameters:
      - description: ID книги
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: Опубликовано
        "400":
          description: No PDF uploaded
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Прямая публикация
      tags:
      - Book requests
  /books/{id}/publish-request:
    post:
      description: Владелец подаёт заявку на публикацию своей книги; PDF уже должен
        быть загружен
      parameters:
      - description: ID книги
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.BookStatusResponse'
        "400":
          description: No PDF uploaded
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "409":
          description: Already published or request already pending
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Заявка на публикацию
      tags:
      - Book requests
  /books/{id}/status:
    get:
      description: draft — нет заявки, pending/approved/rejected — по последней заявке
        (при rejected есть reason), published — книга в каталоге. Видимость как у
        книги
      parameters:
      - description: ID книги
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.BookStatusResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Статус книги
      tags:
      - Books
  /languages:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.Language'
            type: array
      summary: Список языков
      tags:
      - Dictionaries
  /moderation/requests:
    get:
      description: Открытые заявки, старые первыми (только Moderator+)
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.ModerationRequest'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Заявки на публикацию
      tags:
      - Book requests
  /moderation/requests/{id}:
    patch:
      consumes:
      - application/json
      description: approved публикует книгу, rejected требует reason (только Moderator+)
      parameters:
      - description: ID заявки
        in: path
        name: id
        required: true
        type: string
      - description: Решение
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.ReviewRequestBody'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.ReviewRequestResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "404":
          description: Pending request not found
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Решение по заявке
      tags:
      - Book requests
  /topics:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.Topic'
            type: array
      summary: Список жанров
      tags:
      - Dictionaries
  /users/{id}/role:
    patch:
      consumes:
      - application/json
      description: Меняет роль пользователя (только Admin). Снятие модератора — выдача
        роли user
      parameters:
      - description: ID пользователя
        in: path
        name: id
        required: true
        type: string
      - description: Новая роль
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.ChangeRoleBody'
      responses:
        "204":
          description: Роль изменена
        "400":
          description: Invalid request, unknown role or own role
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "404":
          description: User not found
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Смена роли
      tags:
      - Users
  /users/me:
    get:
      description: Данные авторизованного пользователя (по access-токену из cookie)
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.MeResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Текущий пользователь
      tags:
      - Users
  /users/me/books:
    get:
      description: Книги из библиотеки пользователя, от новых к старым. status — статус
        чтения (reading, read), null если не задан. Фильтр по status
      parameters:
      - description: reading или read
        in: query
        name: status
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.LibraryBook'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Моя библиотека
      tags:
      - Books
  /users/me/books/{id}:
    delete:
      description: 'Идемпотентно: если книги в библиотеке нет, тоже 204'
      parameters:
      - description: ID книги
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: Книги нет в библиотеке
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "404":
          description: Invalid book id
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Убрать книгу из библиотеки
      tags:
      - Books
    post:
      description: Можно добавить публичную книгу или свою. Повторное добавление ничего
        не меняет
      parameters:
      - description: ID книги
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: Книга в библиотеке
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Добавить книгу в библиотеку
      tags:
      - Books
  /users/me/books/{id}/status:
    put:
      consumes:
      - application/json
      description: Отмечает книгу из библиотеки как reading или read
      parameters:
      - description: ID книги
        in: path
        name: id
        required: true
        type: string
      - description: Статус чтения
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.ReadingStatusBody'
      responses:
        "204":
          description: Статус сохранён
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "404":
          description: Book is not in the library
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Статус чтения
      tags:
      - Books
  /users/me/uploads:
    get:
      description: 'Книги, которые загрузил пользователь, со статусом модерации: draft,
        pending, approved, rejected, published. Фильтр по status'
      parameters:
      - description: draft, pending, approved, rejected или published
        in: query
        name: status
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.UploadedBook'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Загруженные мной книги
      tags:
      - Books
swagger: "2.0"

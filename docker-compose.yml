services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: readness
      POSTGRES_PASSWORD: readness
      POSTGRES_DB: readness
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U readness"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
